name: "Benchmark"

on:
    push:
        branches:
            - 'symbol-slots'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Benchmark:
        name: Benchmark (${{ matrix.os }}, ${{ matrix.arch }}, ${{ matrix.mode }}${{ matrix.run && format(' {0}', matrix.run) || '' }})
        runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
        timeout-minutes: 180

        strategy:
            fail-fast: false
            matrix:
                include:
                    # each timing job runs on its own machine: if
                    # they agree, the result isn't down to one runner
                    - {os: linux,   arch: amd64,    mode: time,         run: 1}
                    - {os: linux,   arch: amd64,    mode: time,         run: 2}
                    - {os: macos,   arch: arm64,    mode: time,         run: 1}
                    - {os: macos,   arch: arm64,    mode: time,         run: 2}
                    - {os: linux,   arch: amd64,    mode: instructions}

        steps:
            # head = this branch, base = where it forked off master:
            # so, the only difference between the two is the branch itself
            - name: Checkout head
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo-head
                fetch-depth: 0

            - name: Find base
              id: base
              run: |
                cd arturo-head
                echo "sha=$(git merge-base origin/master HEAD)" >> "$GITHUB_OUTPUT"
                echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Checkout base
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo-base
                ref: ${{ steps.base.outputs.sha }}

            # only to get Nim & all dependencies in place:
            # the binary it builds isn't used
            - name: Setup environment
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                src: ${{ github.ref }}

            - name: Install valgrind
              if: matrix.mode == 'instructions'
              run: |
                sudo apt-get update
                sudo apt-get install -y valgrind

            # both built in exactly the same way: same toolchain,
            # same command, from a fresh cache
            - name: Build base & head (release)
              run: |
                for side in base head; do
                    echo "::group::Building $side"
                    cd "$GITHUB_WORKSPACE/arturo-$side"
                    rm -rf .cache
                    if ! ./build.nims --mode full --arch ${{ matrix.arch }} --log --release --as arturo-bench > "$RUNNER_TEMP/build-$side.log" 2>&1; then
                        tail -100 "$RUNNER_TEMP/build-$side.log"
                        exit 1
                    fi
                    cp bin/arturo-bench "$RUNNER_TEMP/arturo-$side"
                    grep -m1 "flags:" "$RUNNER_TEMP/build-$side.log" | sed 's/\x1b\[[0-9;]*m//g; s/.*flags: //' > "$RUNNER_TEMP/flags-$side.txt"
                    cat "$RUNNER_TEMP/flags-$side.txt"
                    echo "::endgroup::"
                done

                cd "$RUNNER_TEMP"
                if ! diff flags-base.txt flags-head.txt; then
                    echo "base & head weren't built with the same flags!"
                    exit 1
                fi
                if ! grep -q -- "-flto" flags-head.txt; then
                    echo "not a release build (no LTO)!"
                    exit 1
                fi

            - name: Get examples
              if: matrix.mode == 'time'
              run: |
                git clone --depth 1 https://github.com/arturo-lang/examples.git examples

            - name: Describe environment
              run: |
                {
                    echo "## Environment (${{ matrix.os }}-${{ matrix.arch }}, ${{ matrix.mode }}${{ matrix.run && format(' {0}', matrix.run) || '' }})"
                    echo ""
                    echo "| | |"
                    echo "|---|---|"
                    echo "| base | \`${{ steps.base.outputs.sha }}\` |"
                    echo "| head | \`${{ steps.base.outputs.head }}\` |"
                    if [ "${{ matrix.os }}" = "macos" ]; then
                        echo "| cpu | $(sysctl -n machdep.cpu.brand_string) ($(sysctl -n hw.ncpu) cores) |"
                    else
                        echo "| cpu | $(lscpu | sed -n 's/^Model name: *//p') ($(nproc) cores) |"
                    fi
                    echo "| nim | $(nim --version | head -1) |"
                    echo "| cc | $(cc --version | head -1) |"
                    echo "| flags (identical for both) | \`$(cat "$RUNNER_TEMP/flags-head.txt")\` |"
                    for side in base head; do
                        f="$RUNNER_TEMP/arturo-$side"
                        sum=$(shasum -a 256 "$f" | cut -c1-12)
                        echo "| $side binary | $(wc -c < "$f" | tr -d ' ') bytes, sha256 $sum… |"
                    done
                    echo ""
                } >> "$GITHUB_STEP_SUMMARY"

            - name: Run benchmarks
              run: |
                "$RUNNER_TEMP/arturo-base" -v
                "$RUNNER_TEMP/arturo-head" -v

                label="${{ matrix.os }}-${{ matrix.arch }}, ${{ matrix.mode }}${{ matrix.run && format(' {0}', matrix.run) || '' }}"
                if [ "${{ matrix.mode }}" = "instructions" ]; then
                    python3 arturo-head/tools/bench/compare.py "$RUNNER_TEMP/arturo-base" "$RUNNER_TEMP/arturo-head" \
                        --mode instructions --groups ops,programs,real-world,var-names,param-names \
                        --jobs "$(nproc)" --label "$label" --json "$RUNNER_TEMP/results.json"
                elif [ "${{ matrix.os }}" = "linux" ]; then
                    # pinned to a single core: no migrations in between
                    taskset -c 1 python3 arturo-head/tools/bench/compare.py "$RUNNER_TEMP/arturo-base" "$RUNNER_TEMP/arturo-head" \
                        --examples examples/src/rosetta --label "$label" --json "$RUNNER_TEMP/results.json"
                else
                    python3 arturo-head/tools/bench/compare.py "$RUNNER_TEMP/arturo-base" "$RUNNER_TEMP/arturo-head" \
                        --examples examples/src/rosetta --label "$label" --json "$RUNNER_TEMP/results.json"
                fi

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: benchmark-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}${{ matrix.run && format('-{0}', matrix.run) || '' }}
                path: ${{ runner.temp }}/results.json
                if-no-files-found: ignore
