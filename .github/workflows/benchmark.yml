name: "Benchmark"

on:
    pull_request:
        paths:
            - 'src/**'
            - 'tools/bench/**'
            - '.github/workflows/benchmark.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Benchmark:
        runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || 'ubuntu-latest' }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux,   arch: amd64}
                    - {os: macos,   arch: arm64}

        steps:
            - name: Checkout Arturo sources
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo

            - name: Build head
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                src: ${{ github.ref }}
                release: 'true'

            - name: Keep head binary
              run: |
                cp "$HOME/.arturo/bin/arturo" "$RUNNER_TEMP/arturo-head"

            - name: Checkout base sources
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo-base
                ref: ${{ github.event.pull_request.base.sha }}

            - name: Build base
              run: |
                cd arturo-base
                ./build.nims --mode full --arch ${{ matrix.arch }} --log --release --as arturo-base
                cp bin/arturo-base "$RUNNER_TEMP/arturo-base"

            - name: Run benchmarks
              timeout-minutes: 60
              run: |
                "$RUNNER_TEMP/arturo-base" -v
                "$RUNNER_TEMP/arturo-head" -v
                python3 arturo/tools/bench/compare.py "$RUNNER_TEMP/arturo-base" "$RUNNER_TEMP/arturo-head" --rounds 7
