name: "Benchmark"

# the very same master, with three different versions of mimalloc:
# what we have right now, the latest v2, and the latest v3

on:
    push:
        branches:
            - 'benchmark-mimalloc'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    MASTER: "68b2b27b2"
    CURRENT: "2.2.7"
    VERSIONS: "2.5.2 3.6.1"

jobs:
    Benchmark:
        name: Benchmark (${{ matrix.os }}, ${{ matrix.arch }}, ${{ matrix.run }})
        runs-on: ${{ matrix.os == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
        timeout-minutes: 150

        strategy:
            fail-fast: false
            matrix:
                include:
                    # each job runs on its own machine: if they
                    # agree, the result isn't down to one runner
                    - {os: linux,   arch: amd64,    run: 1}
                    - {os: linux,   arch: amd64,    run: 2}
                    - {os: macos,   arch: arm64,    run: 1}
                    - {os: macos,   arch: arm64,    run: 2}

        steps:
            # the benchmarks & the script comparing them
            - name: Checkout benchmarks
              uses: actions/checkout@v6
              with:
                path: bench

            - name: Checkout master
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo-master
                ref: master
                fetch-depth: 0

            # one copy of master per version, identical
            # except for the allocator's own sources
            - name: Prepare the three versions
              run: |
                git -C arturo-master checkout --detach "$MASTER"
                grep -q "MI_MALLOC_VERSION ${CURRENT//./}" arturo-master/src/extras/mimalloc/include/mimalloc.h
                cp -R arturo-master "arturo-$CURRENT"
                for v in $VERSIONS; do
                    cp -R arturo-master "arturo-$v"
                    curl -sL "https://github.com/microsoft/mimalloc/archive/refs/tags/v$v.tar.gz" | tar xz
                    rm -rf "arturo-$v/src/extras/mimalloc/src" "arturo-$v/src/extras/mimalloc/include"
                    cp -R "mimalloc-$v/src" "mimalloc-$v/include" "arturo-$v/src/extras/mimalloc/"
                    grep "define MI_MALLOC_VERSION" "arturo-$v/src/extras/mimalloc/include/mimalloc.h"
                done

            # only to get Nim & all dependencies in place:
            # the binary it builds isn't used
            - name: Setup environment
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                src: ${{ github.ref }}

            # all built in exactly the same way: same toolchain,
            # same command, from a fresh cache
            - name: Build (release)
              run: |
                for v in $CURRENT $VERSIONS; do
                    echo "::group::Building with mimalloc $v"
                    cd "$GITHUB_WORKSPACE/arturo-$v"
                    rm -rf .cache
                    if ! ./build.nims --mode full --arch ${{ matrix.arch }} --log --release --as arturo-bench > "$RUNNER_TEMP/build-$v.log" 2>&1; then
                        tail -100 "$RUNNER_TEMP/build-$v.log"
                        exit 1
                    fi
                    cp bin/arturo-bench "$RUNNER_TEMP/arturo-$v"
                    grep -m1 "flags:" "$RUNNER_TEMP/build-$v.log" | sed 's/\x1b\[[0-9;]*m//g; s/.*flags: //' > "$RUNNER_TEMP/flags-$v.txt"
                    cat "$RUNNER_TEMP/flags-$v.txt"
                    echo "::endgroup::"
                done

                cd "$RUNNER_TEMP"
                for v in $VERSIONS; do
                    if ! diff "flags-$CURRENT.txt" "flags-$v.txt"; then
                        echo "not built with the same flags!"
                        exit 1
                    fi
                done
                if ! grep -q -- "-flto" "flags-$CURRENT.txt"; then
                    echo "not a release build (no LTO)!"
                    exit 1
                fi

            # do they still work?
            - name: Check
              run: |
                cd arturo-master/tests/unittests
                for v in $CURRENT $VERSIONS; do
                    for t in parallelism lib.strings lib.iterators loops scopes; do
                        if "$RUNNER_TEMP/arturo-$v" "$t.art" 2>&1 | sed 's/[[:space:]]*$//' | diff -q - <(sed 's/[[:space:]]*$//' "$t.res") > /dev/null; then
                            echo "mimalloc $v: $t ok"
                        else
                            echo "mimalloc $v: $t FAILED"
                            echo "| mimalloc $v | \`$t\` failed |" >> "$RUNNER_TEMP/failed.txt"
                        fi
                    done
                done

            - name: Describe environment
              run: |
                {
                    echo "## Environment (${{ matrix.os }}-${{ matrix.arch }}, ${{ matrix.run }})"
                    echo ""
                    echo "| | |"
                    echo "|---|---|"
                    echo "| master | \`$(git -C arturo-master rev-parse HEAD)\` |"
                    if [ "${{ matrix.os }}" = "macos" ]; then
                        echo "| cpu | $(sysctl -n machdep.cpu.brand_string) ($(sysctl -n hw.ncpu) cores) |"
                    else
                        echo "| cpu | $(lscpu | sed -n 's/^Model name: *//p') ($(nproc) cores) |"
                    fi
                    echo "| nim | $(nim --version | head -1) |"
                    echo "| cc | $(cc --version | head -1) |"
                    echo "| flags (identical for all) | \`$(cat "$RUNNER_TEMP/flags-$CURRENT.txt")\` |"
                    for v in $CURRENT $VERSIONS; do
                        f="$RUNNER_TEMP/arturo-$v"
                        echo "| mimalloc $v | $(wc -c < "$f" | tr -d ' ') bytes |"
                    done
                    if [ -f "$RUNNER_TEMP/failed.txt" ]; then cat "$RUNNER_TEMP/failed.txt"; fi
                    echo ""
                } >> "$GITHUB_STEP_SUMMARY"

            - name: Run benchmarks
              run: |
                label="${{ matrix.os }}-${{ matrix.arch }}, ${{ matrix.run }}"
                binaries="v$CURRENT=$RUNNER_TEMP/arturo-$CURRENT"
                for v in $VERSIONS; do binaries="$binaries v$v=$RUNNER_TEMP/arturo-$v"; done
                if [ "${{ matrix.os }}" = "linux" ]; then
                    # pinned to a single core: no migrations in between
                    taskset -c 1 python3 bench/tools/bench/compare.py $binaries \
                        --groups ops,programs,real-world --label "$label" --json "$RUNNER_TEMP/results.json"
                else
                    python3 bench/tools/bench/compare.py $binaries \
                        --groups ops,programs,real-world --label "$label" --json "$RUNNER_TEMP/results.json"
                fi

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: benchmark-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.run }}
                path: ${{ runner.temp }}/results.json
                if-no-files-found: ignore
