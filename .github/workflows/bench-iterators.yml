name: "Benchmark (iterators)"

on:
    push:
        branches:
            - 'fix-iterator-shadowing'
    workflow_dispatch:

jobs:
    Benchmark:
        runs-on: ${{ matrix.runner }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux, arch: amd64, runner: ubuntu-latest}
                    - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
                    - {os: macos, arch: arm64, runner: macos-latest}
                    - {os: macos, arch: amd64, runner: macOS-15-intel}

        steps:
            - name: Checkout PR
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo-new

            - name: Checkout master
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo-master
                ref: master

            - name: Install Arturo (toolchain)
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                src: master
                create_artifact: 'false'

            - name: Build both
              run: |
                for d in arturo-master arturo-new; do
                    (cd $d && ./build.nims --as arturo-bench)
                done
                if [ "${{ matrix.os }}" = "macos" ]; then
                    brew install hyperfine
                else
                    sudo apt-get install -y hyperfine
                fi

            - name: Prepare scripts
              run: |
                mkdir bench && cd bench

                # many short iterator calls
                cat > short.art <<'EOF'
                f: function [xs][map xs 'x -> x + 1]
                loop 1..1500000 'i [z: f [1 2 3]]
                print z
                EOF

                # short calls, with index + multiple params
                cat > params.art <<'EOF'
                loop 1..600000 'i [
                    z: map.with:'j [1 2 3 4] [a b] -> a + b + j
                    w: select [1 2 3 4] 'x -> even? x
                ]
                print [z w]
                EOF

                # body-dominated
                cat > long.art <<'EOF'
                loop 1..30 'k [
                    s: 0
                    loop 1..300000 'x [s: s + x]
                ]
                print s
                EOF

                # iterator variable named after a function
                cat > shadow.art <<'EOF'
                loop 1..1500000 'i [z: map [1 2 3] 'size -> 1]
                print z
                EOF

                # nested
                cat > nested.art <<'EOF'
                loop 1..5000 'i [
                    z: fold.seed:0 map 1..50 'x -> select 1..x 'y -> odd? y [a,b] -> a + size b
                ]
                print z
                EOF

                # dictionary
                cat > dict.art <<'EOF'
                d: #[]
                loop 1..50 'i -> d\[to :string i]: i
                loop 1..80000 'r [
                    s: 0
                    loop d [k v] [s: s + v]
                ]
                print s
                EOF

                # `=>`
                cat > thick.art <<'EOF'
                loop 1..1500000 'i [
                    z: map [1 2 3] => [& * 2]
                ]
                print z
                EOF

                head -50 *.art

            - name: Run
              run: |
                cd bench
                M=$GITHUB_WORKSPACE/arturo-master/bin/arturo-bench
                N=$GITHUB_WORKSPACE/arturo-new/bin/arturo-bench

                for f in *.art; do
                    a=$($M $f 2>&1); b=$($N $f 2>&1)
                    [ "$a" = "$b" ] || { echo "OUTPUT DIFFERS: $f"; echo "$a"; echo "$b"; }
                done

                # two rounds, in opposite order, so that drift
                # doesn't favor either side
                for f in *.art; do
                    hyperfine -N --warmup 3 --runs 20 -n master "$M $f" -n PR "$N $f" --export-json "$f.1.json"
                    hyperfine -N --warmup 3 --runs 20 -n PR "$N $f" -n master "$M $f" --export-json "$f.2.json"
                done

                {
                    echo "## ${{ matrix.os }}-${{ matrix.arch }}"
                    echo ""
                    echo "| script | master (ms) | PR (ms) | PR/master |"
                    echo "|---|---|---|---|"
                    for f in *.art; do
                        jq -rs --arg f "$f" '
                            [.[].results[]] as $r
                            | ([$r[] | select(.command=="master") | .times[]] | add/length*1000) as $m
                            | ([$r[] | select(.command=="PR") | .times[]] | add/length*1000) as $p
                            | "| \($f) | \($m|floor) | \($p|floor) | \(($p/$m*1000|round)/1000) |"
                        ' "$f.1.json" "$f.2.json"
                    done
                } | tee -a $GITHUB_STEP_SUMMARY
