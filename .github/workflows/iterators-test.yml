name: "Iterators test (temporary)"

on:
    push:
        branches:
            - 'faster-iterators'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Test:
        runs-on: ${{
            (matrix.os == 'linux')   && (matrix.support == 'legacy' && (matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04') || matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') ||
            (matrix.os == 'macos')   && (matrix.arch == 'arm64' && 'macos-latest' || 'macOS-15-intel') ||
            (matrix.os == 'windows') && 'windows-latest' ||
                                        'ubuntu-latest'  }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux,   arch: amd64}
                    - {os: linux,   arch: amd64,    support: legacy}
                    - {os: linux,   arch: amd64,    mode: mini}
                    - {os: linux,   arch: arm64}
                    - {os: linux,   arch: arm64,    support: legacy}
                    - {os: linux,   arch: arm64,    mode: mini}
                    - {os: freebsd, arch: amd64}
                    - {os: freebsd, arch: amd64,    mode: mini}
                    - {os: macos,   arch: amd64}
                    - {os: macos,   arch: amd64,    mode: mini}
                    - {os: macos,   arch: arm64}
                    - {os: macos,   arch: arm64,    mode: mini}
                    - {os: windows, arch: amd64}
                    - {os: windows, arch: amd64,    mode: mini}

        defaults:
            run:
                shell: ${{
                    (matrix.os == 'freebsd') && 'freebsd {0}' ||
                    (matrix.os == 'windows') && 'msys2 {0}'   ||
                                                'bash'        }}

        steps:
            - name: Checkout Arturo sources
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo
                ref: ${{ github.ref }}

            - name: Install Arturo
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                mode: ${{ matrix.mode }}
                support: ${{ matrix.support }}
                src: ${{ github.ref }}
                create_artifact: 'false'

            - name: Run unit tests
              timeout-minutes: 15
              run: |
                cd $GITHUB_WORKSPACE/arturo
                git clone https://github.com/arturo-lang/examples.git ../examples
                arturo -v
                arturo tools/tester.art

    Benchmark:
        runs-on: ${{ matrix.arch == 'arm64' && 'macos-latest' || 'ubuntu-latest' }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux,   arch: amd64}
                    - {os: macos,   arch: arm64}

        steps:
            - name: Checkout Arturo sources
              uses: actions/checkout@v6
              with:
                path: arturo
                ref: ${{ github.ref }}

            - name: Install Arturo (this branch)
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                src: ${{ github.ref }}
                create_artifact: 'false'

            - name: Build Arturo (master)
              run: |
                cd $GITHUB_WORKSPACE/arturo
                git fetch --depth 1 origin master
                git worktree add ../arturo-master FETCH_HEAD
                cd ../arturo-master
                ./build.nims --mode full --arch ${{ matrix.arch }} --log --as arturo-master

            - name: Run benchmark
              timeout-minutes: 30
              run: |
                cd $GITHUB_WORKSPACE/arturo
                python3 .github/iterators-bench.py ../arturo-master/bin/arturo-master "$(command -v arturo)" .github/iterators-bench.art
