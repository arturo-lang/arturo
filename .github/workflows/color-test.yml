name: "Color test (temporary)"

on:
    push:
        branches:
            - 'sanitize-terminal-colors'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Test:
        runs-on: ${{
            (matrix.os == 'linux')   && (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') ||
            (matrix.os == 'macos')   && (matrix.arch == 'arm64' && 'macos-latest' || 'macOS-15-intel') ||
            (matrix.os == 'windows') && 'windows-latest' ||
                                        'ubuntu-latest'  }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux,   arch: amd64}
                    - {os: linux,   arch: amd64,    mode: mini}
                    - {os: linux,   arch: arm64}
                    - {os: freebsd, arch: amd64}
                    - {os: macos,   arch: amd64}
                    - {os: macos,   arch: arm64}
                    - {os: macos,   arch: arm64,    mode: mini}
                    - {os: windows, arch: amd64}
                    - {os: windows, arch: amd64,    mode: mini}

        defaults:
            run:
                shell: ${{
                    (matrix.os == 'freebsd') && 'freebsd {0}' ||
                    (matrix.os == 'windows') && 'msys2 {0}'   ||
                                                'bash'        }}

        steps:
            - name: Checkout Arturo sources
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo
                ref: ${{ github.ref }}

            - if: matrix.os == 'windows'
              name: Set up Python (Windows)
              id: py
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install Arturo
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                mode: ${{ matrix.mode }}
                support: ${{ matrix.support }}
                src: ${{ github.ref }}
                create_artifact: 'false'

            - name: Color tests
              timeout-minutes: 10
              run: |
                cd $GITHUB_WORKSPACE/arturo
                if [ "${{ matrix.os }}" = "windows" ]; then
                    PY=$(cygpath -u '${{ steps.py.outputs.python-path }}')
                    "$PY" -m pip install --quiet pywinpty
                    BIN=$(command -v arturo)
                    [ -f "$BIN.exe" ] && BIN="$BIN.exe"
                    "$PY" .github/color-test.py "$(cygpath -w "$BIN")"
                else
                    if [ "${{ matrix.os }}" = "freebsd" ]; then
                        command -v python3 >/dev/null || pkg install -y python3
                    fi
                    python3 .github/color-test.py "$(command -v arturo)"
                fi

            - if: matrix.os == 'windows'
              name: Color tests (MSYS2 pty, as in mintty)
              timeout-minutes: 5
              run: |
                cd $GITHUB_WORKSPACE/arturo
                pacman -S --noconfirm --needed python >/dev/null
                /usr/bin/python3 .github/color-test.py "$(command -v arturo)"
