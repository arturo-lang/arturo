name: "Serve battle-test (temporary)"

on:
    push:
        branches:
            - 'serve-battle-test'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Battle:
        runs-on: ${{
            (matrix.os == 'linux')   && (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') ||
            (matrix.os == 'macos')   && (matrix.arch == 'arm64' && 'macos-latest' || 'macOS-15-intel') ||
            (matrix.os == 'windows') && 'windows-latest' ||
                                        'ubuntu-latest' }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux,   arch: amd64}
                    - {os: linux,   arch: arm64}
                    - {os: linux,   arch: amd64, mode: mini}
                    - {os: macos,   arch: arm64}
                    - {os: macos,   arch: amd64}
                    - {os: windows, arch: amd64}

        defaults:
            run:
                shell: ${{ (matrix.os == 'windows') && 'msys2 {0}' || 'bash' }}

        steps:
            - name: Checkout Arturo sources
              uses: actions/checkout@v6
              with:
                path: arturo
                ref: ${{ github.ref }}

            - name: Install Arturo
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                mode: ${{ matrix.mode }}
                src: ${{ github.ref }}
                create_artifact: 'false'

            - name: Locate binary
              id: bin
              run: |
                b="$(command -v arturo)"
                if [ "${{ matrix.os }}" = "windows" ]; then b="$(cygpath -w "$b")"; fi
                echo "path=$b" >> "$GITHUB_OUTPUT"
                arturo --version || true

            - name: Run battle-test
              timeout-minutes: 15
              shell: ${{ (matrix.os == 'windows') && 'pwsh' || 'bash' }}
              run: ${{ (matrix.os == 'windows') && 'python' || 'python3' }} arturo/.github/serve-battle.py "${{ steps.bin.outputs.path }}"
