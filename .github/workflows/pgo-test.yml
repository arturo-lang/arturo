name: "PGO test"

on:
    push:
        branches:
            - 'pgo-test'
    workflow_dispatch:

jobs:
    Measure:
        name: ${{ matrix.os }}-${{ matrix.arch }} ${{ matrix.mode }} ${{ matrix.extra }}
        timeout-minutes: 120
        runs-on: ${{ matrix.runner }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux,   arch: amd64, mode: full, runner: ubuntu-latest,    cc: gcc}
                    - {os: linux,   arch: amd64, mode: mini, runner: ubuntu-latest,    cc: gcc}
                    - {os: linux,   arch: arm64, mode: full, runner: ubuntu-24.04-arm, cc: gcc}
                    - {os: linux,   arch: arm64, mode: mini, runner: ubuntu-24.04-arm, cc: gcc}
                    - {os: macos,   arch: amd64, mode: full, runner: macOS-15-intel,   cc: clang}
                    - {os: macos,   arch: amd64, mode: mini, runner: macOS-15-intel,   cc: clang}
                    - {os: macos,   arch: arm64, mode: full, runner: macos-latest,     cc: clang}
                    - {os: macos,   arch: arm64, mode: mini, runner: macos-latest,     cc: clang}
                    - {os: windows, arch: amd64, mode: full, runner: windows-latest,   cc: gcc}
                    - {os: windows, arch: amd64, mode: mini, runner: windows-latest,   cc: gcc}
                    - {os: windows, arch: amd64, mode: full, runner: windows-latest,   cc: gcc, extra: "-flto"}
                    - {os: windows, arch: amd64, mode: mini, runner: windows-latest,   cc: gcc, extra: "-flto"}

        defaults:
            run:
                shell: ${{ (matrix.os == 'windows') && 'msys2 {0}' || 'bash' }}

        steps:
            - name: Set up dependencies and Nim
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                mode: ${{ matrix.mode }}
                src: ${{ github.ref }}
                create_artifact: 'false'

            - name: Checkout sources
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo

            - name: Build, train, compare & test
              working-directory: arturo
              env:
                PGO_CC: ${{ matrix.cc }}
                PGO_MODE: ${{ matrix.mode }}
                PGO_EXTRA: ${{ matrix.extra }}
                PGO_ARCH: ${{ matrix.os != 'windows' && format('--arch {0}', matrix.arch) || '' }}
              run: |
                if [ "${{ matrix.os }}" = "windows" ]; then
                    pacman -S --noconfirm --needed perl > /dev/null
                    export PATH="${{ github.workspace }}/nim/nim-2.4.0/bin:$PATH"
                fi
                ./tools/pgo/ci.sh

    FreeBSD:
        name: freebsd-amd64 ${{ matrix.mode }}
        timeout-minutes: 150
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                mode: [full, mini]

        steps:
            - name: Checkout sources
              uses: actions/checkout@v6
              with:
                submodules: recursive
                path: arturo

            - name: Build, train, compare & test (in a FreeBSD VM)
              uses: vmactions/freebsd-vm@v1
              with:
                usesh: true
                sync: rsync
                copyback: true
                prepare: |
                  pkg update -f
                  pkg install -y bash git nim perl5 ca_root_nss
                  if [ "${{ matrix.mode }}" = "full" ]; then
                      pkg install -y gtk3 mpfr webkit2-gtk_41 pkgconf openssl
                  fi
                run: |
                  cd arturo
                  export PATH="/usr/local/nim/bin:$PATH"
                  export PGO_CC=clang PGO_MODE=${{ matrix.mode }}
                  export GITHUB_STEP_SUMMARY="$PWD/summary.md"
                  git config --global --add safe.directory '*'
                  rc=0
                  bash ./tools/pgo/ci.sh || rc=$?
                  echo "$rc" > rc.txt

            - name: Report
              working-directory: arturo
              run: |
                cat summary.md >> "$GITHUB_STEP_SUMMARY" || true
                exit "$(cat rc.txt)"
