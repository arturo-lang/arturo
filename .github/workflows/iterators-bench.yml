name: "Iterators benchmark (temporary)"

on:
    push:
        branches:
            - 'faster-iterators'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    Benchmark:
        runs-on: ${{
            (matrix.os == 'linux') && (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') ||
            (matrix.os == 'macos') && (matrix.arch == 'arm64' && 'macos-latest' || 'macOS-15-intel') ||
                                      'ubuntu-latest'  }}

        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: linux,   arch: amd64}
                    - {os: linux,   arch: arm64}
                    - {os: macos,   arch: amd64}
                    - {os: macos,   arch: arm64}

        steps:
            - name: Checkout Arturo sources
              uses: actions/checkout@v6
              with:
                path: arturo
                ref: ${{ github.ref }}

            - name: Install Arturo (this branch)
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                src: ${{ github.ref }}
                create_artifact: 'false'

            - name: Build Arturo (master)
              run: |
                cd $GITHUB_WORKSPACE/arturo
                git fetch --depth 1 origin master
                git worktree add ../arturo-master FETCH_HEAD
                cd ../arturo-master
                ./build.nims --mode full --arch ${{ matrix.arch }} --log --as arturo-master

            - name: Run benchmark
              timeout-minutes: 45
              run: |
                cd $GITHUB_WORKSPACE/arturo
                python3 .github/iterators-bench.py ../arturo-master/bin/arturo-master "$(command -v arturo)" .github/iterators-bench.art | tee bench.txt
                { echo '```'; cat bench.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
