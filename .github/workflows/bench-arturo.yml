# TEMPORARY (pocket-bignum): Arturo 0.10.0 (as released) vs master vs master + PocketBignum
# (both as published: release builds, with PGO), on every platform - tools/bench-arturo
name: Benchmark Arturo

on:
    push:
        branches: [pocket-bignum]
    workflow_dispatch:
        inputs:
            runs:
                description: 'Timed runs per script and binary (medians are reported)'
                default: '10'

jobs:
    bench:
        name: bench (${{ matrix.name }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 240
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: linux-amd64,   runner: ubuntu-latest,    os: linux,   arch: amd64, prefix: 'taskset -c 1' }
                    - { name: linux-arm64,   runner: ubuntu-24.04-arm, os: linux,   arch: arm64, prefix: 'taskset -c 1' }
                    - { name: macos-arm64,   runner: macos-latest,     os: macos,   arch: arm64, prefix: '' }
                    - { name: macos-amd64,   runner: macos-15-intel,   os: macos,   arch: amd64, prefix: '' }
                    - { name: windows-amd64, runner: windows-latest,   os: windows, arch: amd64, prefix: '' }
        steps:
            - uses: actions/checkout@v6

            - name: Arturo 0.10.0 (as released)
              if: matrix.os != 'windows'
              uses: arturo-lang/setup-arturo@v2
              with:
                do: fetch
                from: stable
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}

            - name: Arturo 0.10.0 (as released, Windows)
              if: matrix.os == 'windows'
              shell: bash
              run: |
                # (self-contained: the executable & its DLLs)
                curl -fsSL -o arturo.zip https://github.com/arturo-lang/arturo/releases/download/v0.10.0/arturo-0.10.0-windows-amd64.zip
                python -c "import zipfile; zipfile.ZipFile('arturo.zip').extractall('bins/0.10.0')"

            - name: Keep it
              shell: bash
              run: |
                if [ "${{ matrix.os }}" != "windows" ]; then
                    python3 -c "import os, shutil; shutil.copytree(os.environ['arturoDistPath'], 'bins/0.10.0')"
                fi
                ls bins/0.10.0
                v=$(bins/0.10.0/arturo -v)
                echo "$v"
                case "$v" in *0.10.0*) ;; *) echo "not 0.10.0"; exit 1 ;; esac

            - name: Arturo master (release, PGO)
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                src: master
                release: 'true'
                pgo: 'true'

            - name: Keep it
              shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
              run: |
                mkdir -p bins/master
                if [ "${{ matrix.os }}" = "windows" ]; then cp bin/arturo.exe bins/master/
                else cp -R "$arturoDistPath"/. bins/master/; fi
                bins/master/arturo -v
                # (setup-arturo can't install Nim twice in the same place)
                rm -rf nim

            - name: Arturo master + PocketBignum (release, PGO)
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: ${{ matrix.os }}
                arch: ${{ matrix.arch }}
                src: ${{ github.sha }}
                release: 'true'
                pgo: 'true'

            - name: Keep it
              shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
              run: |
                mkdir -p bins/pocketbignum
                if [ "${{ matrix.os }}" = "windows" ]; then cp bin/arturo.exe bins/pocketbignum/
                else cp -R "$arturoDistPath"/. bins/pocketbignum/; fi
                bins/pocketbignum/arturo -v

            - name: Benchmarks
              # (on Windows, in MSYS2: the builds' DLLs are on its path)
              shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
              run: |
                exe=""; [ "${{ matrix.os }}" = "windows" ] && exe=".exe"
                py=$(command -v python3 || command -v python)
                "$py" tools/bench-arturo/run.py \
                    --bin "0.10.0=bins/0.10.0/arturo$exe" \
                    --bin "master=bins/master/arturo$exe" \
                    --bin "master+pocketbignum=bins/pocketbignum/arturo$exe" \
                    --runs "${{ github.event.inputs.runs || '10' }}" \
                    --prefix "${{ matrix.prefix }}" \
                    --platform "${{ matrix.name }}" \
                    --json "bench-${{ matrix.name }}.json" --md "bench-${{ matrix.name }}.md"
                cat "bench-${{ matrix.name }}.md" >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/upload-artifact@v6
              with:
                name: bench-${{ matrix.name }}
                path: bench-${{ matrix.name }}.*

    summary:
        name: summary
        needs: bench
        if: always()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/download-artifact@v6
              with:
                pattern: bench-*
                merge-multiple: true
                path: reports
            - name: Summary
              run: |
                python3 tools/bench-arturo/summary.py reports/*.json > summary.md
                cat summary.md >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@v6
              with:
                name: bench-summary
                path: summary.md
