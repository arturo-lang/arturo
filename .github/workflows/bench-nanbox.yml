# TEMPORARY (nan-boxing): master vs NaN-boxed builds of this branch
name: Benchmark NaN-boxing

on:
    push:
        branches: [nan-boxing]
    workflow_dispatch:

jobs:
    bench:
        name: bench (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: linux-amd64, os: ubuntu-latest,    arch: amd64 }
                    - { name: linux-arm64, os: ubuntu-24.04-arm, arch: arm64 }
        steps:
            - uses: actions/checkout@v6

            - name: Build master (release, as published)
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: linux
                arch: ${{ matrix.arch }}
                src: master
                release: 'true'
                pgo: 'true'

            - run: mkdir -p "$HOME/bins" && cp "$HOME/.arturo/bin/arturo" "$HOME/bins/master"

            - name: Build nan-boxing (release, as published, -d:NANBOX)
              uses: arturo-lang/setup-arturo@v2
              env:
                ARTURO_EXTRA: -d:NANBOX
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: linux
                arch: ${{ matrix.arch }}
                src: ${{ github.sha }}
                release: 'true'
                pgo: 'true'

            - run: cp "$HOME/.arturo/bin/arturo" "$HOME/bins/nanbox"

            - name: Build master (with symbols, for profiling)
              uses: arturo-lang/setup-arturo@v2
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: linux
                arch: ${{ matrix.arch }}
                src: master

            - run: cp "$HOME/.arturo/bin/arturo" "$HOME/bins/master-sym"

            - name: Build nan-boxing (with symbols, for profiling)
              uses: arturo-lang/setup-arturo@v2
              env:
                ARTURO_EXTRA: -d:NANBOX
              with:
                do: compile
                token: ${{ secrets.GITHUB_TOKEN }}
                os: linux
                arch: ${{ matrix.arch }}
                src: ${{ github.sha }}

            - run: cp "$HOME/.arturo/bin/arturo" "$HOME/bins/nanbox-sym"

            - name: Same results
              run: |
                for f in tools/bench-nanbox/*.art; do
                    a=$("$HOME/bins/master" "$f"); b=$("$HOME/bins/nanbox" "$f")
                    [ "$a" = "$b" ] && echo "same: $(basename "$f")" || { echo "DIFFERENT: $f"; echo "$a"; echo "$b"; exit 1; }
                done

            - name: Timings (hyperfine)
              run: |
                sudo apt-get install -y hyperfine > /dev/null
                echo "cpu: $(lscpu | sed -n 's/^Model name: *//p' | head -1)" | tee -a "$GITHUB_STEP_SUMMARY"
                for f in tools/bench-nanbox/*.art; do
                    n=$(basename "$f" .art)
                    sudo nice -n -20 hyperfine -N --warmup 3 --runs 20 \
                        -n "$n (master)" "taskset -c 1 $HOME/bins/master $f" \
                        -n "$n (nanbox)" "taskset -c 1 $HOME/bins/nanbox $f" \
                        --export-markdown "/tmp/$n.md"
                    cat "/tmp/$n.md" >> "$GITHUB_STEP_SUMMARY"
                done

            - name: Instruction counts (callgrind)
              run: |
                sudo apt-get install -y valgrind > /dev/null
                echo "| script | master | nanbox | nanbox / master |" | tee -a "$GITHUB_STEP_SUMMARY"
                echo "|---|---|---|---|" | tee -a "$GITHUB_STEP_SUMMARY"
                for f in tools/bench-nanbox/*.art; do
                    ir() { valgrind --tool=callgrind --callgrind-out-file=/dev/null "$1" "$f" 2>&1 >/dev/null | sed -n 's/.*Collected : \([0-9]*\).*/\1/p'; }
                    a=$(ir "$HOME/bins/master"); b=$(ir "$HOME/bins/nanbox")
                    echo "| $(basename "$f" .art) | $a | $b | $(echo "scale=3; $b / $a" | bc) |" | tee -a "$GITHUB_STEP_SUMMARY"
                done

            - name: Profile (sieve)
              run: |
                for b in master-sym nanbox-sym; do
                    echo "=== $b"
                    valgrind --tool=callgrind --callgrind-out-file="/tmp/cg.$b" "$HOME/bins/$b" tools/bench-nanbox/sieve.art > /dev/null 2>&1
                    callgrind_annotate --inclusive=no "/tmp/cg.$b" 2>/dev/null | grep -E '^ *[0-9,]+ ' | head -30
                done
